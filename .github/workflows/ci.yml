# CI Pipeline: Test and Publish rnw-components
#
# Strategy:
#   1. Lint the module source
#   2. Run unit tests from _test/ (pure Node, no container, no emulator)
#   3. Run enforcement greps (G1-G19) plus docs-diff check
#   4. Publish to GitHub Packages on main push if version is not on the registry
#
# The visual Expo app is NOT part of CI (per plan: "The visual app is not CI").
# Visual verification is done manually by the developer before publishing.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install dependencies
        run: npm install
      - name: Run ESLint
        run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install test dependencies
        working-directory: _test
        run: npm install
      - name: Run tests
        working-directory: _test
        run: npm test

  enforcement:
    name: Enforcement Greps
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - name: G1 - No accessibilityState
        run: |
          if grep -rn "accessibilityState" component/ components.js; then
            echo "FAIL: accessibilityState found"
            exit 1
          fi
          echo "PASS"
      - name: G2 - No accessibilityValue
        run: |
          if grep -rn "accessibilityValue" component/ components.js; then
            echo "FAIL: accessibilityValue found"
            exit 1
          fi
          echo "PASS"
      - name: G3 - No accessibilityHint
        run: |
          if grep -rn "accessibilityHint" component/ components.js; then
            echo "FAIL: accessibilityHint found"
            exit 1
          fi
          echo "PASS"
      - name: G4 - No accessibilityViewIsModal
        run: |
          if grep -rn "accessibilityViewIsModal" component/ components.js; then
            echo "FAIL: accessibilityViewIsModal found"
            exit 1
          fi
          echo "PASS"
      - name: G5 - No importantForAccessibility
        run: |
          if grep -rn "importantForAccessibility" component/ components.js; then
            echo "FAIL: importantForAccessibility found"
            exit 1
          fi
          echo "PASS"
      - name: G6 - announceForAccessibility in LiveRegionProvider only
        run: |
          HITS=$(grep -rn "announceForAccessibility" component/ | grep -v "provider/liveRegionProvider" || true)
          if [ -n "$HITS" ]; then
            echo "FAIL: announceForAccessibility outside LiveRegionProvider"
            echo "$HITS"
            exit 1
          fi
          echo "PASS"
      - name: G7 - No LayoutAnimation
        run: |
          if grep -rn "LayoutAnimation" component/; then
            echo "FAIL: LayoutAnimation found"
            exit 1
          fi
          echo "PASS"
      - name: G8 - No direct react import in component/ or components.js
        run: |
          if grep -rnE "(require\(|from )['\"]react['\"]" component/ components.js; then
            echo "FAIL: direct react import found - React must come from shared_libs"
            exit 1
          fi
          echo "PASS"
      - name: G9 - No Lib.Client in component/
        run: |
          if grep -rn "Lib.Client" component/; then
            echo "FAIL: Lib.Client found"
            exit 1
          fi
          echo "PASS"
      - name: G10 - No useWindowDimensions
        run: |
          if grep -rn "useWindowDimensions" component/ components.js; then
            echo "FAIL: useWindowDimensions found"
            exit 1
          fi
          echo "PASS"
      - name: G11 - No __DEV__
        run: |
          if grep -rn "__DEV__" component/ components.js; then
            echo "FAIL: __DEV__ found"
            exit 1
          fi
          echo "PASS"
      - name: G12 - No createPortal
        run: |
          if grep -rn "createPortal" component/; then
            echo "FAIL: createPortal found"
            exit 1
          fi
          echo "PASS"
      - name: G13 - No downshift/flatpickr/floating-ui dependencies
        run: |
          if grep -rn "downshift\|flatpickr\|floating-ui" package.json; then
            echo "FAIL: forbidden dependency found"
            exit 1
          fi
          echo "PASS"
      - name: G14 - No @carbon/react runtime dependency
        run: |
          if grep -rn "@carbon/react" package.json; then
            echo "FAIL: @carbon/react found in package.json"
            exit 1
          fi
          echo "PASS"
      - name: G15 - No responsive prop objects
        run: |
          if grep -rnE "props\.[a-zA-Z]+\s*\[\s*(breakpoint|bp)\s*\]" component/; then
            echo "FAIL: responsive prop object found"
            exit 1
          fi
          echo "PASS"
      - name: G16 - No organism/ directory
        run: |
          test ! -d component/organism && echo "PASS" || { echo "FAIL: organism/ directory exists"; exit 1; }
      - name: G17 - Canonical must not import from variant/ or freeform/
        run: |
          if grep -rnE "(require\(|from )['\"][^'\"]*/(variant|freeform)/" component/atom component/molecule component/composite; then
            echo "FAIL: canonical imports from variant/ or freeform/"
            exit 1
          fi
          echo "PASS"
      - name: G18 - Atoms compose only Text and Icon
        run: |
          HITS=$(grep -rn "Registry\." component/atom | grep -v "Registry\.Text" | grep -v "Registry\.Icon" || true)
          if [ -n "$HITS" ]; then
            echo "FAIL: atom uses Registry beyond Text/Icon"
            echo "$HITS"
            exit 1
          fi
          echo "PASS"
      - name: G19 - Freeform must not use Style_ or Registry
        run: |
          HITS=$(grep -rnE "Style_|Registry\.[A-Z]" component/freeform/*.js | grep -v "^[^:]*:[0-9]*://" || true)
          if [ -n "$HITS" ]; then
            echo "FAIL: freeform uses Style_ or Registry"
            echo "$HITS"
            exit 1
          fi
          echo "PASS"
      - name: G20 - Docs must be regenerated (no diff)
        run: |
          DOCS="README.md ROBOTS.md docs/api.md docs/platform-support.md docs/carbon-parity.md"
          mkdir -p /tmp/g20
          for f in $DOCS; do cp "$f" "/tmp/g20/$(basename $f)"; done
          node .github/ci-scripts/generate-docs.js
          FAIL=0
          for f in $DOCS; do
            if ! diff -q "/tmp/g20/$(basename $f)" "$f" >/dev/null; then
              echo "FAIL: $f is out of date"
              diff "/tmp/g20/$(basename $f)" "$f" | head -20
              FAIL=1
            fi
          done
          rm -rf /tmp/g20
          if [ "$FAIL" -ne 0 ]; then
            echo "Run node .github/ci-scripts/generate-docs.js and commit the result."
            exit 1
          fi
          echo "PASS: docs are up to date"
      - name: G21 - Generated artifacts must be regenerated (no diff)
        run: |
          ART="data/component-exports.generated.js data/component-deps.js all.js"
          mkdir -p /tmp/g21
          for f in $ART; do cp "$f" "/tmp/g21/$(basename $f)"; done
          node .github/ci-scripts/generate-exports.js
          FAIL=0
          for f in $ART; do
            if ! diff -q "/tmp/g21/$(basename $f)" "$f" >/dev/null; then
              echo "FAIL: $f is out of date"
              diff "/tmp/g21/$(basename $f)" "$f" | head -20
              FAIL=1
            fi
          done
          rm -rf /tmp/g21
          if [ "$FAIL" -ne 0 ]; then
            echo "Run node .github/ci-scripts/generate-exports.js and commit the result."
            exit 1
          fi
          echo "PASS: generated artifacts are up to date"
      - name: G22 - Provider factories must declare the canonical injection prefix
        run: |
          CANON="Lib CONFIG ERRORS Parts Registry Style"
          FAIL=0
          for f in component/provider/*.js; do
            SIG=$(grep -oE "^export default function \(([^)]*)\)" "$f" | head -1 \
                  | sed -E "s/^export default function \(//; s/\)$//; s/,//g")
            if [ -z "$SIG" ]; then
              echo "FAIL: $f has no recognizable default export signature"
              FAIL=1
              continue
            fi
            i=1
            for p in $SIG; do
              EXPECTED=$(echo $CANON | cut -d" " -f$i)
              if [ "$p" != "$EXPECTED" ]; then
                echo "FAIL: $f param $i is '$p', canonical order requires '$EXPECTED'"
                FAIL=1
              fi
              i=$((i+1))
            done
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "A provider receives arguments positionally from addProviders."
            echo "A shorter list is allowed, but it must be a PREFIX of: $CANON"
            exit 1
          fi
          echo "PASS: all provider signatures are canonical prefixes"
      - name: G23 - No default export in components.js or all.js
        run: |
          if grep -nE "^export default" components.js all.js; then
            echo "FAIL: a package entry file declares a default export."
            echo "createSystem is the only entry point and the barrel exports"
            echo "named maps. A default export reintroduces a second surface."
            exit 1
          fi
          echo "PASS: no default export in components.js or all.js"
      - name: G24 - No hardcoded color values in component/
        run: |
          if grep -rnE "#[0-9a-fA-F]{3,6}" component/; then
            echo "FAIL: component/ contains a hardcoded color."
            echo "Every color comes from the theme. createSystem validates"
            echo "that all 22 required Color tokens are present, so a fallback"
            echo "is dead code and a literal is a vendor lock-in."
            exit 1
          fi
          echo "PASS: no hardcoded color values in component/"
      - name: G25 - Prose mechanics (no British spelling, em dash, or banned vocabulary)
        run: |
          hits=$(git grep -niE "colour|behaviour|recognis|initialis|optimise|optimisation" -- . ':(exclude)*/node_modules/*' ':(exclude)_test/visual/bundle.js' ':(exclude).github/*' 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "FAIL: British spelling found. Use American English (color, behavior, recognize, initialize, optimize)."
            echo "$hits"
            exit 1
          fi
          em=$(git grep -n "—" -- . ':(exclude)*/node_modules/*' ':(exclude)_test/visual/bundle.js' ':(exclude).github/*' 2>/dev/null || true)
          if [ -n "$em" ]; then
            echo "FAIL: em dash found. Use a comma, a period, or ' - ' instead."
            echo "$em"
            exit 1
          fi
          echo "PASS: no British spelling or em dash in tracked files"
      - name: G26 - Peer-dep utilization (use Lib.Utils primitives, not raw length/keys checks)
        run: |
          hits=$(git grep -nE "\.length (===|!==|>) 0|(===|!==) ''|Object\.keys\([^)]+\)\.length" -- '*.js' ':(exclude)*/node_modules/*' ':(exclude)_test/*' ':(exclude).github/*' ':(exclude)data/*' ':(exclude)scripts/*' 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "FAIL: raw length or keys check found. Use Lib.Utils.isEmptyArray, isEmptyObject, or isEmptyString."
            echo "$hits"
            exit 1
          fi
          echo "PASS: no raw length or keys checks in module source"

  contract:
    name: L4 Contract Tests
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install test dependencies
        working-directory: _test
        run: npm install
      - name: L4-R1 - No non-existent RN exports
        working-directory: _test
        run: node --import ./harness/register.js --test --test-name-pattern="L4-R1" contract.test.js
      - name: L4-R4 - No cloneElement in composites
        working-directory: _test
        run: node --import ./harness/register.js --test --test-name-pattern="L4-R4" contract.test.js
      - name: L4-R5 - No Math/parseFloat/parseInt in components
        working-directory: _test
        run: node --import ./harness/register.js --test --test-name-pattern="L4-R5" contract.test.js
      - name: L4-R6 - No direct mechanism requires
        working-directory: _test
        run: node --import ./harness/register.js --test --test-name-pattern="L4-R6" contract.test.js
      - name: L4-R7 - No Style_ identifiers
        working-directory: _test
        run: node --import ./harness/register.js --test --test-name-pattern="L4-R7" contract.test.js
      - name: L4-R8 - No fontWeight with per-weight-face family
        working-directory: _test
        run: node --import ./harness/register.js --test --test-name-pattern="L4-R8" contract.test.js
      - name: L4-R9 - text_disabled only in disabled branches
        working-directory: _test
        run: node --import ./harness/register.js --test --test-name-pattern="L4-R9" contract.test.js
      - name: L4-R10 - BORDER tokens not used as font color
        working-directory: _test
        run: node --import ./harness/register.js --test --test-name-pattern="L4-R10" contract.test.js
      - name: L4-R11 - Contrast enforcement
        working-directory: _test
        run: node --import ./harness/register.js --test --test-name-pattern="L4-R11" contract.test.js
      - name: L4-PROOF - Rules detect violations
        working-directory: _test
        run: node --import ./harness/register.js --test --test-name-pattern="L4-PROOF" contract.test.js

  audit:
    name: L1 Audit Tests
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install test dependencies
        working-directory: _test
        run: npm install
      - name: Run L1 audit tests
        working-directory: _test
        run: node --import ./harness/register.js --test audit.test.js

  playwright:
    name: L3 Visual Tests
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install test dependencies
        working-directory: _test
        run: npm install
      - name: Install Playwright browsers
        working-directory: _test
        run: npx playwright install --with-deps chromium
      - name: Build visual bundle
        working-directory: _test
        run: npx esbuild visual/entry.js --bundle --format=esm --outfile=visual/bundle.js --platform=browser --alias:react-native=react-native-web --define:process.env.NODE_ENV=\"development\" --alias:node:module=./harness/node-module-stub.js
      - name: Run L3 Playwright tests
        working-directory: _test
        run: npx playwright test

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [test, enforcement, contract, audit, playwright]
    if: github.ref == 'refs/heads/main' && !cancelled() && needs.test.result == 'success' && needs.enforcement.result == 'success' && needs.contract.result == 'success' && needs.audit.result == 'success' && needs.playwright.result == 'success'
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
      - name: Check if version needs publishing
        id: check
        run: |
          PKG_NAME=$(jq -r '.name' package.json)
          PKG_VERSION=$(jq -r '.version' package.json)
          LOCAL_SHASUM=$(npm pack --dry-run --json 2>/dev/null | jq -r '.[0].shasum')
          REGISTRY_SHASUM=$(npm view "$PKG_NAME@$PKG_VERSION" dist.shasum 2>/dev/null || echo "")
          if [ -n "$REGISTRY_SHASUM" ] && [ "$LOCAL_SHASUM" = "$REGISTRY_SHASUM" ]; then
            echo "needs_publish=false" >> $GITHUB_OUTPUT
            echo "Registry already serves $PKG_NAME@$PKG_VERSION with identical content (shasum $LOCAL_SHASUM)"
          elif [ -n "$REGISTRY_SHASUM" ] && [ "$LOCAL_SHASUM" != "$REGISTRY_SHASUM" ]; then
            echo "needs_publish=false" >> $GITHUB_OUTPUT
            echo "FAIL: $PKG_NAME@$PKG_VERSION exists on registry with a different shasum."
            echo "Local:  $LOCAL_SHASUM"
            echo "Remote: $REGISTRY_SHASUM"
            echo "Delete the version from the registry before pushing, then push again."
            echo "Never bump the version number to work around this."
            exit 1
          else
            echo "needs_publish=true" >> $GITHUB_OUTPUT
            echo "Version $PKG_NAME@$PKG_VERSION needs publishing (shasum $LOCAL_SHASUM)"
          fi
      - name: Publish to GitHub Packages
        if: steps.check.outputs.needs_publish == 'true'
        run: npm publish
